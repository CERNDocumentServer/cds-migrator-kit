name: dep_ts
queries:
  - q: '980:INTNOTETSPUBL OR 690C:INTNOTETSPUBL -980:CLINOT -690C_:LHCPROJECTREPORT -690C_:SCICOM'
    dump_file_prefix: ts_notes
  - q: '710__5:TS 980:ARTICLE -980:CLINOT -690C_:LHCPROJECTREPORT -690C_:SCICOM'
    dump_file_prefix: ts_dep_article
  - q: '710__5:TS 980:PREPRINT -980:CLINOT -690C_:LHCPROJECTREPORT -690C_:SCICOM'
    dump_file_prefix: ts_dep_preprint
  - q: '710__5:ST 980:ARTICLE -980:CLINOT -690C_:LHCPROJECTREPORT -690C_:SCICOM'
    dump_file_prefix: st_dep_article
  - q: '710__5:ST 980:PREPRINT -980:CLINOT -690C_:LHCPROJECTREPORT -690C_:SCICOM'
    dump_file_prefix: st_dep_preprint

flags:
  include_plots: true
  preferred_model: technical_support
# slugs of the communities the records are added to, the same in every environment;
# they must exist in the environment
communities:
  - ts-dep   # slug of the community (local id was 97ffcddd-ee1f-4e21-ac7b-b78612dc81d8)
